<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    划词翻译 · 图标源文件（128 基准）
    ────────────────────────────────────────────────────────────────
    构成：圆角方底 + 简化地球（外圈 / 两条经线 / 一条赤道）+ 字母 A + 右上角四角星

    两个刻意的设计决定：
    1. 所有几何都是手写路径，不依赖任何字体 —— 换机器渲染结果完全一致，
       也不会因为系统没有某个字体而悄悄退化成 Arial。
    2. 字母 A 底下先描一圈底色（stroke: url(#bg)，宽度 18）做「留白」，
       把穿过 A 的经纬线推开。否则经纬线会横切字面，看着像被划了两刀。

    PNG（16 / 32 / 48 / 128）由 dev 脚本导出，见 README「图标」一节。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C86FA"/>
      <stop offset="1" stop-color="#1A45C4"/>
    </linearGradient>
  </defs>

  <!-- 圆角方底 -->
  <rect x="0" y="0" width="128" height="128" rx="30" ry="30" fill="url(#bg)"/>

  <!-- 简化地球：外圈 + 两条经线 + 一条赤道 -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <circle cx="64" cy="66" r="41" stroke-width="7"/>
    <ellipse cx="64" cy="66" rx="15.5" ry="41" stroke-width="4" opacity="0.5"/>
    <ellipse cx="64" cy="66" rx="29" ry="41" stroke-width="4" opacity="0.34"/>
    <ellipse cx="64" cy="66" rx="41" ry="14" stroke-width="4" opacity="0.5"/>
  </g>

  <!-- 字母 A：先铺一圈底色留白，再画字身 -->
  <path d="M64 47 L46 91 M64 47 L82 91 M57 77 L71 77"
        fill="none" stroke="url(#bg)" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M64 47 L46 91 M64 47 L82 91 M57 77 L71 77"
        fill="none" stroke="#ffffff" stroke-width="10.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 右上角四角星：同样带一圈底色留白，压在地球外圈上也分得开 -->
  <path d="M100.5 13 Q102.9 25.1 114.5 27.5 Q102.9 29.9 100.5 42
           Q98.1 29.9 86.5 27.5 Q98.1 25.1 100.5 13 Z"
        fill="none" stroke="url(#bg)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M100.5 13 Q102.9 25.1 114.5 27.5 Q102.9 29.9 100.5 42
           Q98.1 29.9 86.5 27.5 Q98.1 25.1 100.5 13 Z"
        fill="#FFC93C"/>
</svg>
